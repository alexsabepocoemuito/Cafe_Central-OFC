<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carrinho - Café Central</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/cardapio.css">
    </head>
    <body>
        <header class="topo">
            <div class="logo">
                <a href="../index.html">
                    <img  class="ImagemLogo" src="../img/cafe_central_logo_classic.png" alt="Logo Café Central">
                </a>
                <a href="login.html">
                    <img  class="iconeLogin" src="../img/icone_perfil.png" alt="Icone Login">
                </a>
                <a href="carrinho.html">
                    <img class="iconeComprar" src="../img/icone_carrinho.png" alt="Icone Compras">
                </a>
            </div>
            <nav class="menu">
                <a href="../index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="cardapio.html">Cardápio</a>
                <a href="contato.html">Contato</a>
            </nav>
        </header>

        <main class="cardapio-container">
            <h1 class="cardapio-titulo">Seu Carrinho</h1>

            <div class="carrinho-container">
                <div class="carrinho-lista" id="listaCarrinho">
                    <!-- Itens do carrinho serão renderizados aqui -->
                </div>

                <div class="carrinho-resumo">
                    <h2>Resumo</h2>
                    <div class="resumo-item">
                        <span>Subtotal:</span>
                        <span id="valorTotal">R$ 0,00</span>
                    </div>
                    <div class="resumo-item">
                        <span>Entrega:</span>
                        <span>Grátis</span>
                    </div>
                    <div class="resumo-total">
                        <span>Total:</span>
                        <span id="valorTotal">R$ 0,00</span>
                    </div>
                    <button class="btn-finalizar" id="btnFinalizar">Finalizar Pedido</button>
                    <a href="cardapio.html">
                        <button class="btn-continuar">Continuar Comprando</button>
                    </a>
                    <button class="btn-continuar" id="btnLimpar" style="background: #dc3545; color: white; margin-top: 1rem;">
                        Limpar Carrinho
                    </button>
                </div>
            </div>
        </main>

        <footer class="rodape">
            <p>&reg; 2026 Café Central. Todos os Direitos Reservados</p>
            <p><a href="contato.html">Entre em Contato</a></p>
        </footer>

        <script type="module" src="../js/carrinhoPagina.js"></script>
    </body>
</html>
