<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cardápio - Café Central</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/cardapio.css">
    </head>
    <body>
        <header class="topo">
            <div class="logo">
                <a href="index.html">
                <img  class="ImagemLogo" src="../img/cafe_central_logo_classic.png" alt="Logo Café Central">
                </a>
            </div>
            <nav class="menu">
                <a href="../index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="cardapio.html" class="ativo">Cardápio</a>
                <a href="contato.html">Contato</a>
                <a href="login.html">Login</a>
            </nav>
        </header>
            <main class="conteudo-cardapio">
                
            <h1 class="cardapio-titulo">
                Nosso Cardápio
            </h1>

            <div class="busca-container">
                <input
                    type="text"
                    id="BuscarItens"
                    placeholder="O que você deseja hoje?">
            </div>
                <aside class="Botoes-categoria">

                    <button class="btnCategoria" data-categoria="cafes">
                        ☕ Cafés Especiais
                    </button>

                    <button class="btnCategoria" data-categoria="doces">
                        🍰 Doces e Sobremesas
                    </button>

                    <button class="btnCategoria" data-categoria="salgados">
                        🥖 Salgados e Lanches
                    </button>

                </aside>

                <section id="ListaItens" class="lista-itens">
                    <!-- Produtos -->
                </section>

            </main>

        <footer class="rodape">
            <p>&reg; 2026 Café Central. Todos os Direitos Reservados</p>
            <p><a href="contato.html">Entre em Contato</a></p>
        </footer>

        <script type="module" src="../js/cardapio.js"></script>
    </body>
</html>
